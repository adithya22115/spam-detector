<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spam Detector</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; margin: 0; background: #f4f6f8; color: #222; display: flex; justify-content: center; padding: 40px 16px; }
  .card { background: #fff; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,.08); padding: 32px; max-width: 620px; width: 100%; }
  h1 { margin: 0 0 4px; font-size: 24px; }
  .subtitle { margin: 0 0 24px; color: #666; font-size: 14px; }
  textarea { width: 100%; min-height: 140px; padding: 12px; font-size: 15px; border: 1px solid #ccc; border-radius: 8px; resize: vertical; font-family: inherit; }
  .row { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  button { padding: 10px 18px; border: none; border-radius: 8px; font-size: 15px; cursor: pointer; }
  #checkBtn { background: #1976d2; color: #fff; }
  #checkBtn:disabled { opacity: .6; cursor: wait; }
  .example { background: #eee; color: #333; }
  .result { margin-top: 24px; padding: 20px; border-radius: 8px; display: none; }
  .result.spam { background: #ffebee; border: 1px solid #f4c7c3; }
  .result.ham { background: #e8f5e9; border: 1px solid #c8e6c9; }
  .verdict { font-size: 22px; font-weight: 700; }
  .spam .verdict { color: #c62828; }
  .ham .verdict { color: #2e7d32; }
  .detail { margin-top: 8px; color: #444; font-size: 14px; }
  .description { margin-top: 12px; font-size: 14px; color: #333; line-height: 1.5; }
  .bar { margin-top: 12px; height: 8px; background: #e0e0e0; border-radius: 4px; overflow: hidden; }
  .bar > div { height: 100%; width: 0; transition: width .3s; }
  .spam .bar > div { background: #c62828; }
  .ham .bar > div { background: #2e7d32; }
  .error { margin-top: 24px; padding: 14px; border-radius: 8px; background: #fff3e0; border: 1px solid #ffe0b2; color: #e65100; display: none; }
</style>
</head>
<body>
<div class="card">
  <h1>📧 Spam Detector</h1>
  <p class="subtitle">Paste an SMS or email message to check if it's spam.</p>
  <textarea id="message" placeholder="Type or paste a message here..."></textarea>
  <div class="row">
    <button id="checkBtn">Check message</button>
    <button class="example" data-example="Congratulations! You've been selected to receive a FREE iPhone. Click here to claim your prize now!">Spam example</button>
    <button class="example" data-example="Hey, are we still on for lunch tomorrow at 12:30?">Ham example</button>
  </div>
  <div class="result" id="result">
    <div class="verdict" id="verdict"></div>
    <div class="detail" id="detail"></div>
    <p class="description" id="description"></p>
    <div class="bar"><div id="barFill"></div></div>
  </div>
  <div class="error" id="error"></div>
</div>
<script>
  const textarea = document.getElementById('message');
  const checkBtn = document.getElementById('checkBtn');
  const result = document.getElementById('result');
  const verdict = document.getElementById('verdict');
  const detail = document.getElementById('detail');
  const barFill = document.getElementById('barFill');
  const descriptionEl = document.getElementById('description');
  const errorBox = document.getElementById('error');

  document.querySelectorAll('.example').forEach(btn => {
    btn.addEventListener('click', () => {
      textarea.value = btn.dataset.example;
      check();
    });
  });

  checkBtn.addEventListener('click', check);

  async function check() {
    const message = textarea.value.trim();
    if (!message) { showError('Please enter a message first.'); return; }
    hideError();
    result.style.display = 'none';
    checkBtn.disabled = true;
    try {
      const res = await fetch('/predict', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message })
      });
      const data = await res.json();
      if (!res.ok) { showError(data.error || 'Something went wrong.'); return; }
      const isSpam = data.is_spam;
      const prob = (data.spam_probability * 100).toFixed(1);
      result.className = 'result ' + (isSpam ? 'spam' : 'ham');
      verdict.textContent = isSpam ? 'SPAM' : 'HAM';
      detail.textContent = 'Spam probability: ' + prob + '% · confidence: ' + data.confidence;
      descriptionEl.textContent = data.description || (isSpam
        ? 'This message looks like spam.'
        : 'This message looks like a normal message.');
      barFill.style.width = prob + '%';
      result.style.display = 'block';
    } catch (e) {
      showError('Could not reach the server.');
    } finally {
      checkBtn.disabled = false;
    }
  }

  function showError(msg) { errorBox.textContent = msg; errorBox.style.display = 'block'; }
  function hideError() { errorBox.style.display = 'none'; }
</script>
</body>
</html>
